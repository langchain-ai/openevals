name: release-python
run-name: Release Python Package from ${{ inputs.working-directory || 'python' }} by @${{ github.actor }}
on:
  push:
    branches:
      - main
    paths:
      - "python/pyproject.toml"
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "From which folder this pipeline executes"
      dangerous-nonmain-release:
        required: false
        type: boolean
        default: false
        description: "Release from a non-main branch (danger!)"
  workflow_dispatch:
    inputs:
      working-directory:
        description: "From which folder this pipeline executes"
        default: "python"
        required: true
        type: choice
        options:
          - "python"
      dangerous-nonmain-release:
        required: false
        type: boolean
        default: false
        description: "Release from a non-main branch (danger!)"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_FROZEN: "true"
  UV_NO_SYNC: "true"

jobs:
  build:
    if: github.ref == 'refs/heads/main' || inputs.dangerous-nonmain-release
    environment: Scheduled testing
    runs-on: ubuntu-latest

    outputs:
      pkg-name: ${{ steps.check-version.outputs.pkg-name }}
      version: ${{ steps.check-version.outputs.version }}
      should-publish: ${{ steps.check-version.outputs.should-publish }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # We want to keep this build stage *separate* from the release stage,
      # so that there's no sharing of permissions between them.
      # The release stage has trusted publishing and GitHub repo contents write access,
      # and we want to keep the scope of that access limited just to the release job.
      # Otherwise, a malicious `build` step (e.g. via a compromised dependency)
      # could get access to our GitHub or PyPI credentials.
      #
      # Per the trusted publishing GitHub Action:
      # > It is strongly advised to separate jobs for building [...]
      # > from the publish job.
      # https://github.com/pypa/gh-action-pypi-publish#non-goals
      - name: Build Python package
        run: uv build
        working-directory: ${{ inputs.working-directory || 'python' }}
      
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ inputs.working-directory || 'python' }}/dist/

      - name: Check Version
        id: check-version
        shell: python
        working-directory: ${{ inputs.working-directory || 'python' }}
        run: |
          import os
          import tomllib
          import urllib.error
          import urllib.request
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          pkg_name = data["project"]["name"]
          version = data["project"]["version"]

          # Skip publishing if this version is already on PyPI, so edits to
          # pyproject.toml that don't bump the version (e.g. dependency
          # updates) are a no-op. Any error other than a 404 fails the job
          # rather than guessing.
          url = f"https://pypi.org/pypi/{pkg_name}/{version}/json"
          try:
              urllib.request.urlopen(url, timeout=30)
              should_publish = False
              print(f"{pkg_name}=={version} is already on PyPI, skipping publish.")
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              should_publish = True
              print(f"{pkg_name}=={version} is not on PyPI yet, will publish.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pkg-name={pkg_name}\n")
              f.write(f"version={version}\n")
              f.write(f"should-publish={str(should_publish).lower()}\n")

  publish:
    needs:
      - build
    if: needs.build.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # This permission is used for trusted publishing:
      # https://blog.pypi.org/posts/2023-04-20-introducing-trusted-publishers/
      #
      # Trusted publishing has to also be configured on PyPI for each package:
      # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
      id-token: write

    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'python' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ inputs.working-directory || 'python' }}/dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.working-directory || 'python' }}/dist/
          verbose: true
          print-hash: true
          # Temp workaround since attestations are on by default as of gh-action-pypi-publish v1.11.0
          attestations: false

  mark-release:
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      # This permission is needed by `ncipollo/release-action` to
      # create the GitHub release.
      contents: write

    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'python' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python + uv
        uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ inputs.working-directory || 'python' }}/dist/

      - name: Create Tag
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ inputs.working-directory || 'python' }}/dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{needs.build.outputs.pkg-name}}==${{ needs.build.outputs.version }}
          commit: main
          makeLatest: true